<style>
:root {

/* ========== Layout ========== */
.app {

  width: 100%;
  display: flex;
  justify-content: center;
  padding: 0;
}

.container {

/* ========== Progress Bar ========== */
.progress-wrap {

  padding: 12px 0 16px;
  background: linear-gradient(to bottom, rgba(255, 248, 240, 0.95), rgba(255, 248, 240, 0.7) 80%, transparent);

}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(168, 85, 247, 0.12);

}

.progress-fill {

  border-radius: 999px;

}

.screen {

  flex-direction: column;
  animation: fadeIn 0.5s ease;
}
.screen.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
  0% { transform: scale(0.96); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ========== Start Screen ========== */
.start {

  justify-content: center;

}

.back-btn {

.loading {

  text-align: center;

}

.loading-orb {
  width: 110px;
  height: 110px;
  position: relative;
}

.loading-orb::before,
.loading-orb::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-soft), var(--accent-deep));
  opacity: 0.7;
  animation: pulse 2s ease-in-out infinite;
}

.loading-orb::after {
  animation-delay: 1s;
}

.loading-orb-core {
  position: absolute;
  inset: 25px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FCE7F3, #F0E6FF);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  animation: spin 3s linear infinite;
}

@keyframes pulse {

  50% { transform: scale(1.15); opacity: 0.2; }
}

@keyframes spin {

}

.loading-title {

}

.loading-text {

function makeFallbackData(label, emoji) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff7fb"/>
          <stop offset="100%" stop-color="#f0e6ff"/>
        </linearGradient>
      </defs>
      <rect width="800" height="1000" rx="40" fill="url(#g)"/>
      <text x="400" y="430" text-anchor="middle" font-size="120">${emoji}</text>
      <text x="400" y="560" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="48" font-weight="700" fill="#7C3AED">${label}</text>
      <text x="400" y="630" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="28" fill="#555">reference image</text>
    </svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

function uniqueList(arr) {
  return [...new Set((arr || []).filter(Boolean))];
}

function getLabelKey(label) {
  if (label === '메이크업') return 'makeup';
  if (label === '패션') return 'fashion';
  return 'celeb';
}

function getLabelItem(typeId, label) {
  const items = REFERENCE_GALLERIES[typeId] || [];
  return items.find(item => item.label === label) || null;
}

function normalizeGalleryItem(type, item) {
  const labelKey = getLabelKey(item.label);
  const siblingImages = (REFERENCE_GALLERIES[type.id] || [])
    .filter(other => other !== item)
    .map(other => other.image);
  return {
    ...item,
    labelKey,
    images: uniqueList([item.image, ...(item.backups || []), ...siblingImages, ...(GENERIC_FALLBACKS[labelKey] || [])]),
    pinterestUrl: `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(type.pinterest_queries[labelKey])}`,
    googleUrl: `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(type.pinterest_queries[labelKey])}`,
    sourceUrl: item.link
  };
}

function imageAttr(candidates) {
  const list = uniqueList(candidates);
  const first = list[0] || '';
  return `src="${first}" data-fallbacks='${JSON.stringify(list)}' data-fallback-index="0"`;
}

function handleImageError(img) {
  try {
    const list = JSON.parse(img.dataset.fallbacks || '[]');
    const nextIndex = Number(img.dataset.fallbackIndex || '0') + 1;
    if (list[nextIndex]) {
      img.dataset.fallbackIndex = String(nextIndex);
      img.src = list[nextIndex];
      return;
    }
  } catch (error) {
    console.warn('image fallback parse error', error);
  }

  const label = img.dataset.fallbackLabel || 'image';
  const emoji = img.dataset.fallbackEmoji || '✨';
  img.onerror = null;
  img.src = makeFallbackData(label, emoji);
  img.classList.add('fallback');
}

function getPreviewImage(typeId) {
  const item = getLabelItem(typeId, '메이크업') || REFERENCE_GALLERIES[typeId]?.[0];
  return item?.image || 'https://images.unsplash.com/photo-1522335789203-aaa8a73c1e02?w=1200&q=80';
}

/* ============================================ */

const $ = (id) => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(`screen${name}`).classList.add('active');

  const showProgress = (name === 'Question');
  $('progressWrap').classList.toggle('active', showProgress);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================ */
/* INIT (URL parameter check)                    */
/* ============================================ */

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const resultId = params.get('result');

  if (resultId) {
    const type = TYPES.find(t => t.id === resultId);
    if (type) {
      // Direct result view
      renderResult(type, true);
      return;
    }
  }

  // Default - start screen
  showScreen('Start');
});

  currentQuestion = 0;
  answers = [];
  scores = {};
  TYPES.forEach(t => scores[t.id] = 0);

  showScreen('Question');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  const total = QUESTIONS.length;
  const num = currentQuestion + 1;
  const pct = Math.round((num / total) * 100);

  $('progressLabel').textContent = `${num} / ${total}`;
  $('progressPercent').textContent = `${pct}%`;
  $('progressFill').style.width = `${pct}%`;

  $('questionCategory').textContent = `QUESTION ${String(num).padStart(2,'0')}`;

  // Animate text change
  const qt = $('questionText');
  qt.style.opacity = '0';
  setTimeout(() => {
    qt.textContent = q.text;
    qt.style.transition = 'opacity 0.3s';
    qt.style.opacity = '1';
  }, 100);

  // Render options
  const container = $('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.style.animationDelay = `${0.05 + idx * 0.07}s`;
    btn.innerHTML = `
      <span class="option-label">${opt.label}</span>
      <span>${opt.text}</span>
    `;
    btn.onclick = () => selectOption(idx, btn);
    container.appendChild(btn);
  });

  // Back button visibility
  $('backBtn').style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';
}

function selectOption(optionIdx, btn) {
  // Visual feedback
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');

  const q = QUESTIONS[currentQuestion];
  const opt = q.options[optionIdx];

  // Save / replace answer
  answers[currentQuestion] = optionIdx;

  // Move on after small delay
  setTimeout(() => {
    if (currentQuestion < QUESTIONS.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      // Calculate scores from all answers
      calculateAndShowResult();
    }
  }, 320);
}

function goBack() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function calculateAndShowResult() {
  // Reset scores then sum
  TYPES.forEach(t => scores[t.id] = 0);
  answers.forEach((optIdx, qIdx) => {
    const opt = QUESTIONS[qIdx].options[optIdx];
    Object.entries(opt.scores).forEach(([typeId, val]) => {
      scores[typeId] += val;
    });
  });

  // Find top type
  let maxScore = -1;
  let topType = TYPES[0];
  TYPES.forEach(t => {
    if (scores[t.id] > maxScore) {
      maxScore = scores[t.id];
      topType = t;
    }
  });

  // Show loading then result
  showScreen('Loading');
  let textIdx = 0;
  $('loadingText').textContent = LOADING_TEXTS[0];
  const interval = setInterval(() => {
    textIdx++;
    if (textIdx < LOADING_TEXTS.length) {
      const lt = $('loadingText');
      lt.style.opacity = '0';
      setTimeout(() => {
        lt.textContent = LOADING_TEXTS[textIdx];
        lt.style.opacity = '1';
      }, 200);
    }
  }, 750);

  setTimeout(() => {
    clearInterval(interval);
    // Update URL with result
    const newUrl = `${window.location.pathname}?result=${topType.id}`;
    history.replaceState({}, '', newUrl);
    renderResult(topType, false);
  }, 3000);
}

/* ============================================ */
/* RESULT                                        */
/* ============================================ */

function renderResult(type, fromUrl) {
  showScreen('Result');

  // Update meta tags dynamically
  const previewImage = getPreviewImage(type.id);
  document.title = `나의 추구미는 [${type.name}] ${type.emoji} - 추구미 테스트`;
  updateMeta('og:title', `나의 추구미는 [${type.name}]! ${type.emoji}`);
  updateMeta('og:description', `${type.subtitle} - ${type.description.substring(0, 80)}...`);
  updateMeta('og:image', previewImage);
  updateMeta('twitter:image', previewImage);
  updateMeta('og:url', window.location.href);

  const screen = $('screenResult');
  screen.style.setProperty('--type-color', type.color);

  const shareUrl = `${window.location.origin}${window.location.pathname}?result=${type.id}`;
  const baseUrl = `${window.location.origin}${window.location.pathname}`;

  screen.innerHTML = `
    <div class="result-section">
      <div class="result-hero" id="resultHero" style="--type-color: ${type.color}">
        <div class="result-tag">YOUR AESTHETIC TYPE</div>
        <span class="result-emoji">${type.emoji}</span>
        <h1 class="result-name">${type.name}</h1>
        <p class="result-subtitle">${type.subtitle}</p>
        <div class="result-color-bar">
          ${type.palette.map(c => `<div class="result-color-dot" style="background:${c}"></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="result-section">
      <div class="section-title">📖 너의 추구미는</div>
      <div class="card">
        <p class="card-description">${type.description}</p>
      </div>
    </div>

    <div class="result-section">
      <div class="section-title">💄 시그니처 스타일</div>
      <div class="card">
        ${renderSignatureStyle(type)}
      </div>
    </div>

    <div class="result-section">
      <div class="section-title">🖼️ 바로 보는 레퍼런스 갤러리</div>
      <div class="card">
        ${renderReferenceGallery(type)}
      </div>
    </div>

    <div class="result-section">
      <div class="section-title">⭐ 너와 닮은 셀럽</div>
      <div class="card">
        ${renderCelebCards(type)}
      </div>
    </div>

    <div class="result-section">
      <div class="section-title">💌 결과 공유하기</div>
      <div class="card">
        <div class="share-buttons">
          <button class="share-btn" onclick="copyLink('${shareUrl}')">
            <span class="share-btn-icon">🔗</span>
            <span>링크 복사</span>
          </button>
          <button class="share-btn kakao" onclick="shareKakao('${type.id}')">
            <span class="share-btn-icon">💬</span>
            <span>카카오톡</span>
          </button>
          <button class="share-btn twitter" onclick="shareTwitter('${type.id}')">
            <span class="share-btn-icon">𝕏</span>
            <span>트위터</span>
          </button>
        </div>
        <div class="insta-tip">📸 인스타 스토리에 결과 카드를 공유해보세요!<br/>아래 버튼으로 이미지를 저장할 수 있어요</div>
        <button class="save-img-btn" onclick="saveResultImage('${type.id}')">📥 결과 이미지 저장</button>
      </div>
    </div>

    <div class="result-section restart-area">
      <button class="btn btn-primary" onclick="restartTest()">
        <span>${fromUrl ? '✨ 나도 테스트하기' : '🔄 다시 테스트하기'}</span>
      </button>
      ${fromUrl ? '' : `<div style="margin-top:12px"><a class="btn-ghost" href="${baseUrl}" style="display:inline-block">친구에게 추천하기</a></div>`}
    </div>

    <div class="footer-credit">
      © 추구미 테스트 · Made with 💜<br/>
      당신의 미적 감성을 발견하세요
    </div>
  `;
}

function updateMeta(property, content) {
  let el = document.querySelector(`meta[property="${property}"]`) ||
           document.querySelector(`meta[name="${property}"]`);
  if (el) el.setAttribute('content', content);
}

function restartTest() {
  history.replaceState({}, '', window.location.pathname);
  document.title = '추구미 테스트 - 나의 이상적 감성은?';
  startTest();
}

/* ============================================ */
/* SHARE                                         */
/* ============================================ */

function copyLink(url) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('링크가 복사되었어요! 🎉'))
      .catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('링크가 복사되었어요! 🎉');
  } catch (e) {
    showToast('복사 실패. 직접 URL을 복사해주세요.');
  }
  document.body.removeChild(ta);
}

function shareKakao(typeId) {
  const type = TYPES.find(t => t.id === typeId);
  const shareUrl = `${window.location.origin}${window.location.pathname}?result=${typeId}`;

  // If Kakao SDK is loaded and initialized:
  if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
    try {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `나의 추구미는 [${type.name}]! ${type.emoji}`,
          description: type.subtitle,
          imageUrl: getPreviewImage(typeId),
          link: { mobileWebUrl: shareUrl, webUrl: shareUrl }
        },
        buttons: [{
          title: '나도 테스트하기',
          link: { mobileWebUrl: window.location.origin + window.location.pathname }
        }]
      });
      return;
    } catch (e) {
      console.warn('Kakao share failed', e);
    }
  }
  // Fallback - copy to clipboard with friendly message
  copyLink(shareUrl);
  showToast('카카오 SDK 미설정. 링크를 복사했어요! 💬');
}

function shareTwitter(typeId) {
  const type = TYPES.find(t => t.id === typeId);
  const shareUrl = `${window.location.origin}${window.location.pathname}?result=${typeId}`;
  const text = `나의 추구미는 [${type.name}] ${type.emoji}\n${type.subtitle}\n\n#추구미테스트`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}`;
  window.open(url, '_blank', 'noopener');
}

/* ============================================ */
/* SAVE AS IMAGE (html2canvas)                   */
/* ============================================ */

function saveResultImage(typeId) {
  const type = TYPES.find(t => t.id === typeId);
  const snap = $('snapCard');

  snap.innerHTML = `
    <div class="snap-card-inner" style="background:white;border-radius:28px;padding:48px 32px;text-align:center">
      <div style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#7C3AED;background:rgba(168,85,247,0.1);padding:6px 14px;border-radius:999px;margin-bottom:20px">YOUR AESTHETIC TYPE</div>
      <div style="font-size:84px;margin-bottom:16px">${type.emoji}</div>
      <div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;margin-bottom:10px;color:#1A1A2E">${type.name}</div>
      <div style="font-size:16px;color:#555;margin-bottom:24px;font-weight:500">${type.subtitle}</div>
      <div style="height:1px;background:rgba(168,85,247,0.15);margin:24px 0"></div>
      <div style="font-size:14px;line-height:1.7;color:#1A1A2E;text-align:left">${type.description}</div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:24px">
        ${type.palette.map(c => `<div style="width:28px;height:28px;border-radius:50%;background:${c};border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.08)"></div>`).join('')}
      </div>
      <div style="margin-top:32px;padding-top:24px;border-top:1px solid rgba(0,0,0,0.06);font-size:12px;color:#888">
        ✨ 추구미 테스트 · 나의 미적 감성 유형
      </div>
    </div>
  `;

  showToast('이미지를 만들고 있어요...');

  setTimeout(() => {
    html2canvas(snap, {
      backgroundColor: null,
      scale: 2,
      useCORS: true
    }).then(canvas => {
      canvas.toBlob(blob => {
        if (!blob) { showToast('저장 실패. 다시 시도해주세요.'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `추구미_${type.name}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('이미지가 저장되었어요! 📸');
      });
    }).catch(err => {
      console.error(err);
      showToast('저장 실패. 스크린샷을 사용해주세요.');
    });
  }, 100);
}
